name: Build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DERIVED_DATA: build/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: >
          xcodebuild build
          -project WallLoop.xcodeproj -scheme WallLoop -configuration Debug
          -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: >
          xcodebuild test
          -project WallLoop.xcodeproj -scheme WallLoop
          -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO

      - name: Build (Release)
        run: >
          xcodebuild build
          -project WallLoop.xcodeproj -scheme WallLoop -configuration Release
          -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO
