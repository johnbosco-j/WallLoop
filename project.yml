# XcodeGen spec. Regenerate the project with:  xcodegen generate
name: WallLoop

options:
  bundleIdPrefix: com.johnbosco
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: NO

# Both app targets compile the same sources; they differ only in entitlements,
# compilation conditions and (later) linked packages such as Sparkle.
targetTemplates:
  WallLoopApp:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: WallLoop
        PRODUCT_MODULE_NAME: WallLoop
        PRODUCT_BUNDLE_IDENTIFIER: com.johnbosco.wallloop
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

targets:
  # Developer ID build: notarized DMG + Sparkle updates.
  WallLoop:
    templates: [WallLoopApp]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Direct.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIRECT

  # Mac App Store build: sandboxed, public APIs only, no Sparkle, no Labs.
  WallLoop-AppStore:
    templates: [WallLoopApp]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/AppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPSTORE

  WallLoopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: WallLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnbosco.wallloop.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WallLoop.app/Contents/MacOS/WallLoop
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  WallLoop:
    build:
      targets:
        WallLoop: all
    test:
      targets:
        - WallLoopTests
  WallLoop-AppStore:
    build:
      targets:
        WallLoop-AppStore: all
